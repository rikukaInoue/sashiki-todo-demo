# PR プレビュー環境: twig の DB ブランチ + Lambda (Web Adapter) を PR ごとに作り、close で消す。
#
# 必要な設定 (リポジトリの Variables / Secrets):
#   vars.TWIG_API_URL                 twigd の API URL (例 http://twig.internal:8080)
#   secrets.TWIG_API_TOKEN            twig API トークン
#   vars.AWS_ROLE_ARN                 GHA OIDC で assume する IAM ロール
#   vars.AWS_REGION                   例 ap-northeast-1
#   vars.PREVIEW_SUBNET_IDS           Lambda を置くサブネット (カンマ区切り)
#   vars.PREVIEW_SECURITY_GROUP_IDS   twig サーバーの MySQL ポート帯へ届く SG (カンマ区切り)
#
# ランナーは twigd の API に届く場所 (self-hosted, VPC 内) で動かす。
name: pr-preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  id-token: write
  contents: read
  pull-requests: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  TWIG_BRANCH: pr-${{ github.event.pull_request.number }}
  STACK_NAME: twig-todo-pr-${{ github.event.pull_request.number }}

jobs:
  deploy:
    if: github.event.action != 'closed'
    runs-on: [self-hosted, vpc]
    steps:
      - uses: actions/checkout@v4

      - name: twig の DB ブランチを作成 (冪等)
        id: twig
        uses: rikukaInoue/twig/action@main
        with:
          api_url: ${{ vars.TWIG_API_URL }}
          token: ${{ secrets.TWIG_API_TOKEN }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: ビルドとデプロイ (PR ごとに 1 スタック)
        run: |
          sam build
          sam deploy \
            --stack-name "$STACK_NAME" \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              BranchName="$TWIG_BRANCH" \
              DbHost="${{ steps.twig.outputs.host }}" \
              DbPort="${{ steps.twig.outputs.port }}" \
              DbUser="${{ steps.twig.outputs.user }}" \
              SubnetIds=\"${{ vars.PREVIEW_SUBNET_IDS }}\" \
              SecurityGroupIds=\"${{ vars.PREVIEW_SECURITY_GROUP_IDS }}\"

      - name: プレビュー情報を PR にコメント (冪等更新)
        env:
          GH_TOKEN: ${{ github.token }}
          HOST: ${{ steps.twig.outputs.host }}
          PORT: ${{ steps.twig.outputs.port }}
          DBUSER: ${{ steps.twig.outputs.user }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          url=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='PreviewUrl'].OutputValue" --output text)
          marker="<!-- twig-todo-preview -->"
          body="${marker}
          ## 🌿 プレビュー環境

          | | |
          |---|---|
          | アプリ | ${url} |
          | DB ブランチ | \`mysql -u${DBUSER} -h ${HOST} -P ${PORT}\` |

          PR を閉じるとアプリと DB ブランチはどちらも削除されます。"
          existing=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" \
            --jq "[.[] | select(.body | startswith(\"${marker}\"))][0].id" 2>/dev/null || true)
          if [ -n "$existing" ] && [ "$existing" != "null" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" -f body="$body" > /dev/null
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" -f body="$body" > /dev/null
          fi

  cleanup:
    if: github.event.action == 'closed'
    runs-on: [self-hosted, vpc]
    steps:
      - name: twig の DB ブランチを削除 (404 も成功扱い)
        uses: rikukaInoue/twig/action@main
        with:
          api_url: ${{ vars.TWIG_API_URL }}
          token: ${{ secrets.TWIG_API_TOKEN }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: プレビュースタックを削除
        run: |
          aws cloudformation delete-stack --stack-name "$STACK_NAME"
          aws cloudformation wait stack-delete-complete --stack-name "$STACK_NAME"
