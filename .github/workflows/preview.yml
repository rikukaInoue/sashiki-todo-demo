# PR プレビュー環境: sashiki の DB ブランチ + Lambda (Web Adapter) を PR ごとに作り、close で消す。
#
# 2 段構成:
#   db  ジョブ — sashiki の DB ブランチ作成 + PR コメント(常に動く)
#   app ジョブ — SAM で Lambda プレビューをデプロイ(vars.AWS_ROLE_ARN がある場合のみ)
#
# 必要な設定 (リポジトリの Variables / Secrets):
#   vars.SASHIKI_API_URL              sashikid の API URL (例 http://sashiki.internal:8080)
#   secrets.SASHIKI_API_TOKEN         sashiki API トークン (runner が loopback なら不要)
#   -- 以下は Lambda プレビューを使う場合のみ --
#   vars.AWS_ROLE_ARN                 GHA OIDC で assume する IAM ロール
#   vars.AWS_REGION                   例 ap-northeast-1
#   vars.PREVIEW_SUBNET_IDS           Lambda を置くサブネット (カンマ区切り)
#   vars.PREVIEW_SECURITY_GROUP_IDS   sashiki サーバーの MySQL ポート帯へ届く SG (カンマ区切り)
#
# ランナーは sashikid の API に届く場所 (self-hosted, VPC 内) で動かす。
name: pr-preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  id-token: write
  contents: read
  pull-requests: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  SASHIKI_BRANCH: pr-${{ github.event.pull_request.number }}
  STACK_NAME: sashiki-todo-pr-${{ github.event.pull_request.number }}

jobs:
  db:
    if: github.event.action != 'closed'
    runs-on: [self-hosted, vpc]
    outputs:
      host: ${{ steps.sashiki.outputs.host }}
      port: ${{ steps.sashiki.outputs.port }}
      user: ${{ steps.sashiki.outputs.user }}
    steps:
      - name: sashiki の DB ブランチを作成 (冪等) + PR コメント
        id: sashiki
        uses: rikukaInoue/sashiki/action@main
        with:
          api_url: ${{ vars.SASHIKI_API_URL }}
          token: ${{ secrets.SASHIKI_API_TOKEN }}
          profile: preview
          comment: "true"

  app:
    needs: db
    if: github.event.action != 'closed' && vars.AWS_ROLE_ARN != ''
    runs-on: [self-hosted, vpc]
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: ビルドとデプロイ (PR ごとに 1 スタック)
        run: |
          sam build
          sam deploy \
            --stack-name "$STACK_NAME" \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              BranchName="$SASHIKI_BRANCH" \
              DbHost="${{ needs.db.outputs.host }}" \
              DbPort="${{ needs.db.outputs.port }}" \
              DbUser="${{ needs.db.outputs.user }}" \
              SubnetIds=\"${{ vars.PREVIEW_SUBNET_IDS }}\" \
              SecurityGroupIds=\"${{ vars.PREVIEW_SECURITY_GROUP_IDS }}\"

      - name: プレビュー URL を PR にコメント (冪等更新)
        env:
          GH_TOKEN: ${{ github.token }}
          HOST: ${{ needs.db.outputs.host }}
          PORT: ${{ needs.db.outputs.port }}
          DBUSER: ${{ needs.db.outputs.user }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          url=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='PreviewUrl'].OutputValue" --output text)
          marker="<!-- sashiki-todo-preview -->"
          body="${marker}
          ## 🌿 プレビュー環境

          | | |
          |---|---|
          | アプリ | ${url} |
          | DB ブランチ | \`mysql -u${DBUSER} -h ${HOST} -P ${PORT}\` |

          PR を閉じるとアプリと DB ブランチはどちらも削除されます。"
          existing=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" \
            --jq "[.[] | select(.body | startswith(\"${marker}\"))][0].id" 2>/dev/null || true)
          if [ -n "$existing" ] && [ "$existing" != "null" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" -f body="$body" > /dev/null
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" -f body="$body" > /dev/null
          fi

  cleanup:
    if: github.event.action == 'closed'
    runs-on: [self-hosted, vpc]
    steps:
      - name: sashiki の DB ブランチを削除 (404 も成功扱い)
        uses: rikukaInoue/sashiki/action@main
        with:
          api_url: ${{ vars.SASHIKI_API_URL }}
          token: ${{ secrets.SASHIKI_API_TOKEN }}

      - uses: aws-actions/configure-aws-credentials@v4
        if: vars.AWS_ROLE_ARN != ''
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: プレビュースタックを削除
        if: vars.AWS_ROLE_ARN != ''
        run: |
          aws cloudformation delete-stack --stack-name "$STACK_NAME"
          aws cloudformation wait stack-delete-complete --stack-name "$STACK_NAME"
