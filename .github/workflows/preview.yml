# PR プレビュー環境(kagerou 版)。旧 preview.yml 約 260 行の役割は
# kagerou.yaml + kagerou action に移した(DB ブランチは hooks の sashiki create、
# 接続情報は username routing で名前から導出、cleanup は close + TTL reap)。
# runner は sashikid と同居する self-hosted(VPC 内)。AWS 権限は instance profile。
name: pr-preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  preview:
    # fork PR 拒否 + 実行者許可リスト(self-hosted runner の保護)
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository && contains(format(',{0},', vars.PREVIEW_ALLOWED_ACTORS), format(',{0},', github.event.pull_request.user.login))
    runs-on: [self-hosted, vpc]
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Build and package image
        run: |
          sam build
          sam package \
            --image-repository "${{ vars.ECR_REPOSITORY }}" \
            --output-template-file packaged.yaml

      - uses: rikukadev/kagerou/action@main
        with:
          name: pr-${{ github.event.pull_request.number }}
          param: |
            SubnetIds=${{ vars.PREVIEW_SUBNET_IDS }}
            SecurityGroupIds=${{ vars.PREVIEW_SECURITY_GROUP_IDS }}

  cleanup:
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository && contains(format(',{0},', vars.PREVIEW_ALLOWED_ACTORS), format(',{0},', github.event.pull_request.user.login))
    runs-on: [self-hosted, vpc]
    steps:
      - uses: actions/checkout@v4
      - uses: rikukadev/kagerou/action@main
        with:
          name: pr-${{ github.event.pull_request.number }}
          down: "true"
