AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  sashiki-todo-demo の Lambda (Web Adapter) + Function URL。
  共有モード(MultiBranch=true, スタック sashiki-todo-shared)では 1 つの Lambda が
  サブドメイン/パスから branch を判定して全 PR を提供する。
  PR ごとスタックモードでは PR ごとにデプロイし close で削除する。

Parameters:
  EnvSashikiBranch:
    Type: String
    Description: sashiki のブランチ名 (例 pr-123)。UI 表示にも使う
  EnvDbHost:
    Type: String
    Description: sashiki action の出力 host
  EnvDbPort:
    Type: String
    Description: sashiki action の出力 port
  EnvDbUser:
    Type: String
    Description: sashiki action の出力 user (dev@<branch> 形式)
  EnvDbPassword:
    Type: String
    Default: ""
    NoEcho: true
  EnvDbName:
    Type: String
    Default: todo
  BaseDomain:
    Type: String
    Default: ""
    Description: サブドメインでブランチを判定する場合のベースドメイン
  MultiBranch:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: 共有アプリモード(サブドメイン <branch>.<BaseDomain> または /b/<branch>/ で切替)
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: sashiki サーバーに届くサブネット
  SecurityGroupIds:
    Type: List<AWS::EC2::SecurityGroup::Id>
    Description: sashiki サーバーの MySQL ポート帯へ egress できる SG

Resources:
  TodoFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      MemorySize: 256
      Timeout: 30
      Environment:
        Variables:
          SASHIKI_BRANCH: !Ref EnvSashikiBranch
          DB_HOST: !Ref EnvDbHost
          DB_PORT: !Ref EnvDbPort
          DB_USER: !Ref EnvDbUser
          DB_PASSWORD: !Ref EnvDbPassword
          DB_NAME: !Ref EnvDbName
          MULTI_BRANCH: !Ref MultiBranch
          BASE_DOMAIN: !Ref BaseDomain
      # VpcConfig を指定すると SAM が AWSLambdaVPCAccessExecutionRole を自動付与する
      VpcConfig:
        SubnetIds: !Ref SubnetIds
        SecurityGroupIds: !Ref SecurityGroupIds
      FunctionUrlConfig:
        AuthType: NONE
    Metadata:
      Dockerfile: Dockerfile
      DockerContext: .
      DockerTag: todo

Outputs:
  PreviewUrl:
    Description: プレビュー環境の URL
    Value: !GetAtt TodoFunctionUrl.FunctionUrl
