AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  twig-todo-demo: PR プレビュー環境 1 つ分(Lambda + Function URL)。
  DB は twig の DB ブランチを指す。PR ごとに 1 スタックをデプロイし、close で削除する。

Parameters:
  BranchName:
    Type: String
    Description: twig のブランチ名 (例 pr-123)。UI 表示にも使う
  DbHost:
    Type: String
    Description: twig action の出力 host
  DbPort:
    Type: String
    Description: twig action の出力 port
  DbUser:
    Type: String
    Description: twig action の出力 user (dev@<branch> 形式)
  DbPassword:
    Type: String
    Default: ""
    NoEcho: true
  DbName:
    Type: String
    Default: todo
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: twig サーバーに届くサブネット
  SecurityGroupIds:
    Type: List<AWS::EC2::SecurityGroup::Id>
    Description: twig サーバーの MySQL ポート帯へ egress できる SG

Resources:
  TodoFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      MemorySize: 256
      Timeout: 30
      Environment:
        Variables:
          TWIG_BRANCH: !Ref BranchName
          DB_HOST: !Ref DbHost
          DB_PORT: !Ref DbPort
          DB_USER: !Ref DbUser
          DB_PASSWORD: !Ref DbPassword
          DB_NAME: !Ref DbName
      # VpcConfig を指定すると SAM が AWSLambdaVPCAccessExecutionRole を自動付与する
      VpcConfig:
        SubnetIds: !Ref SubnetIds
        SecurityGroupIds: !Ref SecurityGroupIds
      FunctionUrlConfig:
        AuthType: NONE
    Metadata:
      Dockerfile: Dockerfile
      DockerContext: .
      DockerTag: todo

Outputs:
  PreviewUrl:
    Description: プレビュー環境の URL
    Value: !GetAtt TodoFunctionUrl.FunctionUrl
